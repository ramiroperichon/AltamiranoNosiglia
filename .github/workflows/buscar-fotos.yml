name: Buscar fotos (temporal)
on:
  push:
    branches: [ccr-02a461ce-lrwes6]
    paths: [".github/fotos/**", ".github/workflows/buscar-fotos.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/fotos/buscar.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fotos-candidatas
          git commit -m "Fotos candidatas (temporal)" || echo "sin cambios"
          git push
